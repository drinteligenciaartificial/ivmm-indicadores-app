services:
  - type: web
    name: ivmm-indicadores-app
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci && npm run build:render
    preDeployCommand: npm run db:deploy:render && npm run bootstrap:production
    startCommand: npm start
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_LOGIN
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ivmm-indicadores-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: Administrador IVMM
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: ivmm-indicadores-db
    plan: free
    region: virginia
    databaseName: ivmm_indicadores
    user: ivmm_app
    postgresMajorVersion: "18"
